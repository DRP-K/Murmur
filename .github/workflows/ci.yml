name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo

jobs:
  fmt-check:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            .cargo/registry
            .cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check
        working-directory: server

  test-server:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            .cargo/registry
            .cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test
        working-directory: server

  build-client-web:
    name: Build client (production)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_RELAY_URL: "https://murmur.bajzc.com"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client-web/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: client-web

      - name: npm run build
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          NEXT_PUBLIC_RAWG_API_KEY: ${{ secrets.NEXT_PUBLIC_RAWG_API_KEY }}
        run: npm run build
        working-directory: client-web

      - uses: actions/upload-artifact@v4
        with:
          name: client-web-dist
          path: client-web/dist/
          retention-days: 1

  build-client-web-staged:
    name: Build client (staged)
    runs-on: ubuntu-latest
    env:
      NEXT_DIST_DIR: "dist-staged"
      NEXT_PUBLIC_RELAY_URL: "https://murmur-dev-server.bajzc.com"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client-web/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: client-web

      - name: npm run build
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          NEXT_PUBLIC_RAWG_API_KEY: ${{ secrets.NEXT_PUBLIC_RAWG_API_KEY }}
        run: npm run build
        working-directory: client-web

      - uses: actions/upload-artifact@v4
        with:
          name: client-web-dist-staged
          path: client-web/dist-staged/
          retention-days: 1

  deploy-pages:
    name: Deploy to Cloudflare Pages (production)
    needs: build-client-web
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: cloudflare-pages
      url: https://murmur.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: client-web-dist
          path: client-web/dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy client-web/dist --project-name murmur

  deploy-pages-preview:
    name: Deploy to Cloudflare Pages (preview)
    needs: build-client-web-staged
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    environment:
      name: cloudflare-pages-preview/${{ github.ref_name }}
      url: https://murmur-dev-server.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: client-web-dist-staged
          path: client-web/dist-staged

      - name: Deploy preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy client-web/dist-staged --project-name murmur --branch "${{ github.ref_name }}"

  deploy-staged:
    name: Deploy staged (self-hosted)
    runs-on: self-hosted
    needs: [fmt-check, test-server, build-client-web-staged]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: staged
    steps:
      - uses: actions/checkout@v4

      - name: Verify DEEPSEEK_API_KEY is set
        run: test -n "$DEEPSEEK_API_KEY"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Deploy staged
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          docker compose -p murmur-staged -f compose.staged.yml down -v
          docker compose -p murmur-staged -f compose.staged.yml up -d --build --remove-orphans
          docker compose -p murmur-staged -f compose.staged.yml ps

  deploy-production:
    name: Deploy production (self-hosted)
    runs-on: self-hosted
    needs: [fmt-check, test-server, build-client-web]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify DEEPSEEK_API_KEY is set
        run: test -n "$DEEPSEEK_API_KEY"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Deploy production
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          docker compose -f compose.production.yml down
          docker compose -p murmur-production -f compose.production.yml up -d --build --remove-orphans
          docker compose -p murmur-production -f compose.production.yml ps
