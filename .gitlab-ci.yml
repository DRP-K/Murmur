image: ghcr.io/williamqiufeng/devops:murmur-build

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - build
  - test
  - deploy

variables:
  SECRET_DETECTION_ENABLED: "true"
  BUILD_IMAGE: "ghcr.io/williamqiufeng/devops:murmur-build"
  STAGED_IMAGE: "murmur-server:staged"
  TSURU_IMAGE: "murmur-server:tsuru"
  STAGED_CONTAINER_NAME: "murmur-server-staged"
  STAGED_HOST_PORT: "3000"
  STAGED_CONTAINER_PORT: "3000"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

.cargo-cache:
  cache:
    key:
      files:
        - server/Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
      - server/target/

fmt-check:
  stage: test
  extends: .cargo-cache
  before_script:
    - apk add --no-cache build-base pkgconf sqlite-dev
    - rustup component add rustfmt
  script:
    - cd server
    - cargo fmt --check

test-server:
  stage: test
  extends: .cargo-cache
  before_script:
    - apk add --no-cache build-base pkgconf sqlite-dev
  script:
    - cd server
    - cargo test

deploy-staged:
  stage: deploy
  when: manual
  environment:
    name: staged
  before_script:
    - test -n "$DEEPSEEK_API_KEY"
  script:
    - docker compose -p murmur-staged -f compose.staged.yml down -v
    - docker compose -p murmur-staged -f compose.staged.yml up -d --build --remove-orphans
    - docker compose -p murmur-staged -f compose.staged.yml ps

deploy-production:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  environment:
    name: production
  before_script:
    - test -n "$DEEPSEEK_API_KEY"
  script:
    - docker compose -f compose.production.yml down
    - docker compose -p murmur-production -f compose.production.yml up -d --build --remove-orphans
    - docker compose -p murmur-production -f compose.production.yml ps

build-client-web:
  stage: build
  image: node:22-alpine
  cache:
    key:
      files:
        - client-web/package-lock.json
    paths:
      - client-web/node_modules/
  variables:
    NEXT_PUBLIC_RELAY_URL: "https://murmur.bajzc.com"
  before_script:
    - test -n "$NEXT_PUBLIC_TMDB_API_KEY"
    - test -n "$NEXT_PUBLIC_RAWG_API_KEY"
  script:
    - cd client-web
    - npm ci
    - npm run build
  artifacts:
    paths:
      - client-web/dist/
    expire_in: 1 hour

build-client-web-staged:
  stage: build
  image: node:22-alpine
  cache:
    key:
      files:
        - client-web/package-lock.json
    paths:
      - client-web/node_modules/
  variables:
    NEXT_DIST_DIR: "dist-staged"
    NEXT_PUBLIC_RELAY_URL: "https://murmur-dev-server.bajzc.com"
  before_script:
    - test -n "$NEXT_PUBLIC_TMDB_API_KEY"
    - test -n "$NEXT_PUBLIC_RAWG_API_KEY"
  script:
    - cd client-web
    - npm ci
    - npm run build
  artifacts:
    paths:
      - client-web/dist-staged/
    expire_in: 1 hour

deploy-pages:
  stage: deploy
  image: node:22-alpine
  needs:
    - build-client-web
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  environment:
    name: cloudflare-pages
    url: https://murmur.pages.dev
  before_script:
    - test -n "$CLOUDFLARE_API_TOKEN"
    - test -n "$CLOUDFLARE_ACCOUNT_ID"
  script:
    - npx wrangler pages deploy client-web/dist --project-name murmur
deploy-pages-preview:
  stage: deploy
  image: node:22-alpine
  needs:
    - build-client-web-staged
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: manual
  environment:
    name: cloudflare-pages-preview/$CI_COMMIT_REF_SLUG
    url: https://murmur-dev-server.pages.dev
  before_script:
    - test -n "$CLOUDFLARE_API_TOKEN"
    - test -n "$CLOUDFLARE_ACCOUNT_ID"
  script:
    - npx wrangler pages deploy client-web/dist-staged --project-name murmur --branch "$CI_COMMIT_REF_SLUG"

