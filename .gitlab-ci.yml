image: ghcr.io/williamqiufeng/devops:murmur-build

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - build
  - test
  - package
  - deploy
  - secret-detection

variables:
  SECRET_DETECTION_ENABLED: "true"
  BUILD_IMAGE: "ghcr.io/williamqiufeng/devops:murmur-build"
  STAGED_IMAGE: "murmur-server:staged"
  TSURU_IMAGE: "murmur-server:tsuru"
  STAGED_CONTAINER_NAME: "murmur-server-staged"
  STAGED_HOST_PORT: "3000"
  STAGED_CONTAINER_PORT: "3000"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

.cargo-cache:
  cache:
    key:
      files:
        - server/Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
      - server/target/

fmt-check:
  stage: test
  extends: .cargo-cache
  before_script:
    - apk add --no-cache build-base pkgconf sqlite-dev
    - rustup component add rustfmt
  script:
    - cd server
    - cargo fmt --check

test-server:
  stage: test
  extends: .cargo-cache
  before_script:
    - apk add --no-cache build-base pkgconf sqlite-dev
  script:
    - cd server
    - cargo test

package-staged-image:
  stage: package
  tags:
    - murmur-staged
  needs:
    - test-server
  script:
    - docker compose -f compose.staged.yml build

package-tsuru-image:
  stage: package
  needs:
    - test-server
  script:
    - docker build -f Dockerfile.tsuru -t "$TSURU_IMAGE" .

deploy-staged:
  stage: deploy
  tags:
    - murmur-staged
  needs:
    - package-staged-image
  when: manual
  environment:
    name: staged
  script:
    - docker compose -f compose.staged.yml up -d --build --remove-orphans
    - docker compose -f compose.staged.yml ps

deploy-production:
  stage: deploy
  needs:
    - package-tsuru-image
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  environment:
    name: production
  script:
    - docker compose -f compose.production.yml up -d --build --remove-orphans
    - docker compose -f compose.production.yml ps

build-client-web:
  stage: build
  image: node:22-alpine
  cache:
    key:
      files:
        - client-web/package-lock.json
    paths:
      - client-web/node_modules/
  script:
    - cd client-web
    - npm ci
    - npm run build
  artifacts:
    paths:
      - client-web/dist/
    expire_in: 1 hour

deploy-pages:
  stage: deploy
  image: node:22-alpine
  needs:
    - build-client-web
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  environment:
    name: cloudflare-pages
    url: https://murmur.pages.dev
  before_script:
    - test -n "$CLOUDFLARE_API_TOKEN"
    - test -n "$CLOUDFLARE_ACCOUNT_ID"
  script:
    - npx wrangler pages deploy client-web/dist --project-name murmur

sast:
  stage: test

secret_detection:
  stage: secret-detection
