include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - build
  - test
  - package
  - deploy
  - secret-detection

variables:
  SECRET_DETECTION_ENABLED: "true"
  RUST_IMAGE: "rust:1.85.1-alpine3.21"
  STAGED_IMAGE: "murmur-server:staged"
  TSURU_IMAGE: "murmur-server:tsuru"
  STAGED_CONTAINER_NAME: "murmur-server-staged"
  STAGED_HOST_PORT: "3000"
  STAGED_CONTAINER_PORT: "3000"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

.cargo-cache:
  cache:
    key:
      files:
        - server/Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
      - server/target/

build-env-image:
  stage: build
  image: docker:28
  script:
    - docker build -f Dockerfile.build -t murmur-build-env:ci .

fmt-check:
  stage: test
  image: "$RUST_IMAGE"
  needs:
    - build-env-image
  extends: .cargo-cache
  before_script:
    - apk add --no-cache build-base pkgconf sqlite-dev
    - rustup component add rustfmt
  script:
    - cd server
    - cargo fmt --check

test-server:
  stage: test
  image: "$RUST_IMAGE"
  needs:
    - build-env-image
  extends: .cargo-cache
  before_script:
    - apk add --no-cache build-base pkgconf sqlite-dev
  script:
    - cd server
    - cargo test

package-staged-image:
  stage: package
  image: docker:28
  needs:
    - test-server
  script:
    - docker compose -f compose.staged.yml build

package-tsuru-image:
  stage: package
  image: docker:28
  needs:
    - test-server
  script:
    - docker build -f Dockerfile.tsuru -t "$TSURU_IMAGE" .

deploy-staged:
  stage: deploy
  image: docker:28
  needs:
    - package-staged-image
  when: manual
  environment:
    name: staged
  script:
    - docker compose -f compose.staged.yml up -d --build --remove-orphans
    - docker compose -f compose.staged.yml ps

deploy-production:
  stage: deploy
  image: ghcr.io/williamqiufeng/devops:build-env
  needs:
    - package-tsuru-image
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  environment:
    name: production
  before_script:
    - test -n "$TSURU_APP_PRODUCTION"
  script:
    - tsuru app deploy -a "$TSURU_APP_PRODUCTION" --dockerfile Dockerfile.tsuru -- .

sast:
  stage: test

secret_detection:
  stage: secret-detection
